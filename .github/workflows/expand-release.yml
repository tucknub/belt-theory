name: Expand Belt Theory release

on:
  push:
    branches: [main]
    paths:
      - 'release-parts/**'
      - '.github/workflows/expand-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode and expand the verified site release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .site-extract
          mkdir .site-extract
          cat release-parts/site.zip.b64.part* | base64 --decode > /tmp/belt-theory-site.zip
          unzip -q /tmp/belt-theory-site.zip -d .site-extract
          shopt -s dotglob nullglob
          cp -R .site-extract/* .
          rm -rf .site-extract /tmp/belt-theory-site.zip
          python scripts/verify.py

      - name: Commit expanded production site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Expand Belt Theory production site v1.1"
          git push
