name: Authentic Archive review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - 'build.sh'
      - 'package.json'
      - 'prototype/**'
      - 'data/archive-*.json'
      - 'scripts/*archive*.mjs'
      - 'scripts/retrofit-*.mjs'
      - 'scripts/verify-*.mjs'
      - 'IMAGE_RIGHTS_LEDGER.csv'
      - 'AI_DESIGN_ASSET_LEDGER.csv'
      - 'ARCHIVE_SOURCE_AUDIT.md'
      - '*_RETROFIT_AUDIT.md'
      - 'DESIGN_PRESERVATION_RULE.md'
      - 'VISUAL_DIRECTION.md'
      - 'REDESIGN_ROADMAP.md'
      - '.github/workflows/authentic-archive-review.yml'

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build production and Authentic Archive review
        run: npm run build

      - name: Verify generated archive manifest
        run: |
          test -f dist/assets/archive/manifest.json
          test -f dist/image-credits.html
          test -f dist/scorecard-wwe.html
          test -f dist/scorecard-aew.html
          test -f dist/scorecard-tna.html
          test -f dist/scorecard-wcw.html
          test -f dist/scorecard-ecw.html
          test -f dist/report-wwe-vs-aew.html
          test -f dist/report-tna-vs-aew.html
          test -f dist/report-wwe-wcw-ecw.html
          test -f dist/report-did-tna-create-stars.html
          node -e "const m=require('./dist/assets/archive/manifest.json'); if(m.assets.length!==8) process.exit(1); console.log('Verified',m.assets.length,'archival assets')"

      - name: Summarize review output
        run: |
          echo '## Authentic Archive review build' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production pages: 18' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authentic production surfaces: homepage, all five promotion scorecards, all three comparison reports, TNA investigation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production credits: `image-credits.html`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Archival component prototype: `prototype/authentic-home.html`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rights-approved assets: 8' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser image hotlinks: prohibited by verification scripts' >> "$GITHUB_STEP_SUMMARY"
          echo '- Jurisdiction-limited Vince scans and rejected WWE-era ECW images: prohibited by verification scripts' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: belt-theory-authentic-archive-preview
          path: dist
          if-no-files-found: error
          retention-days: 14
